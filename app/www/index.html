<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tomb Raider Link</title>
<style>
:root{--gold:#e2bf6a;--gold2:#a8803a;--ink:#efe6d2;--dim:#a99c84;--bg:#0c0a08;--panel:rgba(14,11,8,.86);--line:rgba(226,191,106,.35);--green:#7fe08a;--red:#e0705a}
*{box-sizing:border-box}
/* scroll bars (the hint text, the secrets list, settings): thin gold on the dark panel */
*{scrollbar-width:thin;scrollbar-color:var(--gold2) rgba(30,24,16,.6)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:rgba(30,24,16,.6);border-radius:4px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold),var(--gold2));border-radius:4px;border:1px solid rgba(0,0,0,.4)}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}::-webkit-scrollbar-corner{background:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 TRGame,"Palatino Linotype","Book Antiqua",Georgia,serif;font-synthesis:none;text-shadow:.07em .07em 0 #3a1406;overflow:hidden;user-select:none}
#bg{position:fixed;inset:0;background:#000 center/cover no-repeat;filter:brightness(.32) saturate(.9) blur(2px);transform:scale(1.04)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.gold{background:linear-gradient(#fff2c4,var(--gold) 45%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(.07em .07em 0 #3a1406)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.35));border-bottom:1px solid var(--line)}
.ldot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--red);box-shadow:0 0 5px rgba(224,112,90,.6)}
.ldot.ok{background:var(--green);box-shadow:0 0 6px rgba(127,224,138,.7)}
header .lvl{font-size:22px;letter-spacing:.06em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;letter-spacing:.08em;padding:3px 8px;border:1px solid var(--line);border-radius:3px;color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--green);border-color:rgba(127,224,138,.45)}.pill.bad{color:var(--red);border-color:rgba(224,112,90,.45)}
button{font:inherit;color:var(--ink);background:rgba(30,24,16,.9);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--gold)}button.primary{color:#1a1206;background:linear-gradient(#f3d88f,#c09040);border-color:#f3d88f;font-weight:bold;letter-spacing:.05em}
.icon{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:18px}
#mapbox{position:relative;flex:1;min-height:120px;background-color:#0c0a08;background-repeat:repeat;image-rendering:pixelated}
#map{image-rendering:auto}
#gl3{position:absolute;inset:0;width:100%;height:100%;display:block}
#b3d{font-size:12px;font-weight:bold;letter-spacing:.02em}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
#note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:15px;pointer-events:none;padding:0 16px}
#note:empty{display:none}
.ncard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 22px;max-width:420px;text-align:center;box-shadow:0 8px 30px #000}
.ncard .big{font-size:21px;letter-spacing:.06em;margin:4px 0}
.ncard ol{text-align:left;margin:14px 0 0;padding-left:22px;color:var(--ink);line-height:1.7}.ncard b{color:var(--gold)}
.spin{font-size:34px;color:var(--gold);animation:spin 3.2s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* the hint panel: a header (label, a dot per step, DONE, fold arrow) over the step: its item's picture, the words, the way */
#hint{background:var(--panel);border-top:1px solid var(--line);padding:6px 12px 10px;touch-action:pan-y}
#hint .hhead{display:flex;align-items:center;gap:10px;min-height:22px;cursor:pointer}
#hint.nostep .hhead,#hint.nostep .icon,#hint.nostep #htxt{display:none}
#hint .sp{flex:1}
#hint .step{font-size:11px;letter-spacing:.14em;color:var(--gold)}
#hint .dots{display:flex;gap:5px;flex-wrap:wrap}
#hint .dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold2);display:block}
#hint .dots i.d{background:var(--gold2)}#hint .dots i.c{background:var(--gold);box-shadow:0 0 6px var(--gold)}#hint .dots i.v{outline:1px solid var(--ink);outline-offset:1px}
#hint .fold{color:var(--dim);font-size:12px}
#hint .hbody{display:flex;align-items:center;gap:10px;margin-top:4px}
#hint .hbody .icon{flex:none;width:22px;height:34px;font-size:13px;border:0;background:none;color:var(--gold2)}
#hint .hbody .icon:hover{color:var(--gold)}
#hint .ok{color:var(--green)}
#hint .hmain{flex:1;min-width:0;max-height:34vh;overflow-y:auto;padding-right:2px}
#hint #hicon{flex:none;max-width:44px;max-height:40px;image-rendering:pixelated;filter:drop-shadow(0 2px 3px #000)}
#hint .txt{font-size:17px;min-height:1.4em}
#hint .way{color:var(--dim);font-size:14px;margin-top:2px}
#hint.done .txt{color:var(--dim)}
#hint.folded .way,#hint.folded .hbody .icon{display:none}
#hint.folded .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0}
#hint.folded #hicon{max-height:26px;max-width:30px}
#mapctl{transition:opacity .5s}#mapctl.faded{opacity:.15}
#mapbox.compass #b3d,#mapbox.compass #mapctl button[title^="Zoom"],#mapbox.compass #rotb,#mapbox.compass #ctr{display:none!important}
#hint .held{margin-top:4px;color:var(--ink)}#hint .held img{height:18px;vertical-align:-4px;margin-right:4px}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:5}
#over .card{width:min(520px,92vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;box-shadow:0 10px 40px #000}
.card h2{margin:0 0 10px;font-weight:normal;letter-spacing:.08em;text-transform:uppercase;font-size:20px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row label{flex:1;color:var(--dim)}
.row.dim{opacity:.45}
.pill.tap{cursor:pointer}.pill.tap:hover{border-color:var(--gold);color:var(--ink)}
.secrow{border-bottom:1px solid rgba(226,191,106,.12);padding:4px 0}.secrow label{color:var(--dim);font-size:13px}
.secno{font-size:24px;width:26px;text-align:center}
.badge{font-size:12px;letter-spacing:.1em;padding:3px 8px;border-radius:3px;border:1px solid}
.badge.ok{color:var(--green);border-color:rgba(127,224,138,.5)}.badge.no{color:var(--dim);border-color:var(--line)}
.sec{margin:16px 0 4px;font-size:12px;letter-spacing:.14em;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:3px}
.sec.fold{cursor:pointer;color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;padding:5px 11px;background:rgba(30,24,16,.9);color:var(--dim);font-size:13px;letter-spacing:.06em}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{color:#1a1206;background:linear-gradient(#f3d88f,#c09040);font-weight:bold}
.small{font-size:14px;color:var(--dim)}
#boot{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;background:#000 center/cover no-repeat}
#boot .box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 22px;max-width:480px}
#boot h1{margin:0 0 4px;font-weight:normal;font-size:30px;letter-spacing:.1em}
/* narrow: Link beside the game on one 16:9 screen (Tomb Raider Dual) leaves it a strip a quarter of the screen wide */
@media (max-width:330px){
 header{padding:6px 8px;gap:6px}header .lvl{font-size:14px;letter-spacing:.03em}.icon{width:28px;height:28px;font-size:15px}
 .pill{font-size:10px;padding:2px 5px}#mapctl{right:6px;top:6px;gap:4px}
 #hint{padding:4px 6px 6px}#hint .txt{font-size:13px}#hint .way{font-size:11px}#hint .hbody{gap:4px}#hint #hicon{max-width:26px;max-height:24px}
 #hint .hbody .icon{width:16px;font-size:11px}#hint .dots i{width:6px;height:6px}
 .ncard{padding:12px 10px}.ncard .big{font-size:16px}.ncard ol{padding-left:16px;font-size:13px}
 #over .card{padding:12px 10px}.row{flex-wrap:wrap}
 /* secrets: number and distance on one line, FOUND/NOT FOUND and SHOW under it (one line with the distance off) */
 .secno{width:18px;font-size:20px}.badge{font-size:10px;padding:2px 5px}.secrow button{padding:4px 8px;font-size:12px}
 .secrow label:not(:empty){flex:1 1 calc(100% - 40px)}}
/* the ending card: fills the page over the map, and scrolls if it has to on a small strip */
#end{position:fixed;inset:0;z-index:6;display:none;overflow-y:auto;background:#14100a;padding:12px 14px}
#end .wrap{max-width:640px;margin:0 auto}
#end h2{margin:0;font-weight:normal;letter-spacing:.08em;font-size:22px}
#end table{width:100%;border-collapse:collapse;margin:8px 0;font-size:16px}
#end th{font-weight:normal;font-size:11px;letter-spacing:.08em;color:var(--dim);text-align:right;padding:2px 0 2px 8px}
#end td{text-align:right;padding:2px 0 2px 8px;border-top:1px solid rgba(226,191,106,.12);white-space:nowrap}
#end td:first-child,#end th:first-child{text-align:left;padding-left:0;white-space:normal}
.endt table{width:100%;border-collapse:collapse;font-size:12px}.endt th{font-weight:normal;font-size:10px;color:var(--dim);text-align:right;padding-left:6px}.endt td{text-align:right;padding-left:6px}.endt td:first-child,.endt th:first-child{text-align:left;padding-left:0}
#end tr.total td{border-top:1px solid var(--gold2);color:var(--gold)}
#end tr.miss td{color:var(--dim)}
#end .dev{color:var(--red);letter-spacing:.08em;margin:6px 0}
#sigbox{display:block;width:100%;height:auto;aspect-ratio:640/180;background:#0c0a08;border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:crosshair}
#sigbox.done{cursor:default}
#hall img{display:block;width:100%;max-width:320px;background:#0c0a08;border:1px solid var(--line);border-radius:4px;margin-top:4px}
@media (max-width:330px){#end{padding:8px}#end h2{font-size:17px}#end table{font-size:11px}#end th{font-size:9px;padding-left:4px}#end td{padding-left:4px}}
/* short landscape screens (the bottom screens of the Surface Duo, AYN Thor, Retroid Pocket Duo): the page doesn't scroll; the levels
   are a list that scrolls on its own (two columns when there's room) and the total, signature and buttons always show */
.endg{display:none}
.endg .lh,.endg .lr{display:grid;grid-template-columns:minmax(0,1fr) 3.6em 2.4em 3.4em 3.4em;column-gap:4px;align-items:baseline}
.endg .lh span{font-size:8px;letter-spacing:.04em;color:var(--dim);text-align:right}.endg .lh span:first-child{text-align:left}
.endg .lr{font-size:12px;padding:2px 0;border-top:1px solid rgba(226,191,106,.12)}
.endg .lscroll .lr.total,#end .date .devs{display:none}
.endg .lr span{text-align:right;white-space:nowrap}.endg .lr .n{text-align:left;overflow:hidden;text-overflow:ellipsis}
.endg .lr.miss{color:var(--dim)}.endg .lr .nr{grid-column:2/-1}
.endg .lr.total{color:var(--gold);border-top:1px solid var(--gold2);margin-top:2px}
.endg .heads{display:grid;grid-template-columns:1fr;column-gap:18px}.endg .heads .lh+.lh{display:none}
.endg .lscroll{flex:1;min-height:0;overflow-y:auto;column-gap:18px}
@media (orientation:landscape) and (max-height:620px){
 #end{overflow:hidden;padding:8px 12px}
 #end .wrap{max-width:none;height:100%;display:flex;flex-direction:column}
 #endtxt{flex:1;min-height:0;display:flex;flex-direction:column}
 #endtxt table{display:none}
 #end h2{font-size:18px;display:inline}#end h2+.small{display:inline;margin-left:10px;font-size:12px}
 .endg{display:flex;flex-direction:column;flex:1;min-height:0;margin:4px 0}
 #end .dev,#endtxt>.small:last-child{display:none}#end .date .devs{display:inline;color:var(--red);letter-spacing:.08em}
 #sigmsg:empty::before{content:'Sign above'}
 #sigbox{width:min(100%,calc(26vh * 640 / 180));flex:none}
 #end .wrap>.row{margin:4px 0 0}#end .wrap>.row button{padding:4px 10px}
}
@media (orientation:landscape) and (max-height:620px) and (min-width:560px){
 .endg .heads{grid-template-columns:1fr 1fr;column-gap:14px}.endg .heads .lh+.lh{display:grid}
 .endg .lscroll{column-gap:14px}.endg .lscroll .lr.total{display:grid}.endg>.lr.total{display:none}
 #sigbox{width:min(100%,calc(36vh * 640 / 180))}
 .endg .lscroll{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(var(--half),auto);grid-auto-flow:column;align-content:start}
}
.bar{height:10px;background:#211a10;border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a1c,#e2bf6a);width:0}
</style></head>
<body>
<div id="bg"></div>
<div id="app">
 <header><span class="ldot" id="link" title="Not linked"></span><span class="lvl gold" id="lvl">Tomb Raider Link</span><span class="pill bad" id="recp" style="display:none" title="Record route is on (Settings, Developer)">&#9679; REC</span><span class="pill tap" id="sec" title="Secrets" style="display:none" onclick="openSecrets()"></span>
  <button class="icon" title="Settings" onclick="openSet()">&#9881;</button></header>
 <div id="mapbox"><canvas id="gl3" style="display:none"></canvas><canvas id="map"></canvas><div id="note"></div>
  <div id="mapctl"><button class="icon" id="recb" title="Mark a story step where Lara stands (Record route)" onclick="recMark()" style="display:none;color:var(--red);border-color:var(--red)">&#10010;</button><button class="icon" id="b3d" title="3D map" onclick="toggle3d()">3D</button><button class="icon" title="Zoom in" onclick="zoom(1)">+</button><button class="icon" title="Zoom out" onclick="zoom(-1)">&minus;</button>
   <button class="icon" id="rotb" title="Turn the map (with the camera or Lara: Settings)" onclick="tog('rot')">&#10227;</button><button class="icon" id="ctr" title="Back to Lara" onclick="recenter()" style="display:none">&#9678;</button></div></div>
 <div id="hint"><div class="hhead" onclick="foldHint()"><span class="step" id="hstep"></span><span class="dots" id="hdots"></span><span class="sp"></span><span class="fold" id="hfold"></span></div>
  <div class="hbody"><button class="icon" onclick="stepNav(-1)" title="Previous step">&#9664;</button><img id="hicon" alt=""><div class="hmain"><div class="txt" id="htxt"></div><div class="way" id="hway"></div></div><button class="icon" onclick="stepNav(1)" title="Next step">&#9654;</button></div></div>
</div>
<div id="boot"></div>
<div id="over" onclick="if(event.target===this)closeSet()"><div class="card" id="setcard"></div></div>
<div id="end"><div class="wrap"><div id="endtxt"></div><canvas id="sigbox" width="640" height="180"></canvas>
 <div class="row"><span class="small" id="sigmsg" style="flex:1"></span><button id="sigclr" onclick="sigClear()">CLEAR</button><button id="sigsave" class="primary" onclick="sigSave()">SAVE</button><button onclick="endClose()">CLOSE</button></div></div></div>
<script src="chd.js"></script><script src="trlevel.js"></script><script src="trmap.js"></script><script src="rnc.js"></script><script src="trbuild.js"></script><script src="tr3d.js"></script><script src="trfont.js"></script><script src="hints.js"></script>
<script>
'use strict';
var VERSION='0.1.0';
/* ================= settings ================= */
var LS={get:function(k,d){try{var v=localStorage.getItem('tr_'+k);return v===null?d:v}catch(e){return d}},set:function(k,v){try{localStorage.setItem('tr_'+k,v)}catch(e){}}};
/* the link is always RetroArch on this device, Network Commands port 55355 (RetroArch's default) */
var CFG={host:'127.0.0.1',port:55355,mode:LS.get('mode','auto'),
 rot:LS.get('rot','0')==='1',turnby:LS.get('turnby','camera')==='lara'?'lara':'camera',zoom:Math.min(160,Math.max(8,+LS.get('zoom','36')||36)),
 /* pickups: keys, puzzle items, guns, ammo and medi packs; step: the way to the next step and its spot (older saved choices
    'keys' and 'route' carry over) */
 pickups:LS.get('pickups',LS.get('keys','1'))==='1',step:LS.get('step',LS.get('route','1'))==='1',secrets:LS.get('secrets','0')==='1',secway:LS.get('secway','1')==='1',
 reveal:LS.get('reveal','1')==='1',fold:LS.get('fold','0')==='1',v3d:LS.get('v3d','0')==='1',
 /* view: the map, or a compass that only points the way (for less hand-holding); hinttext: the step's words in the hint panel */
 view:LS.get('view','map')==='compass'?'compass':'map',hinttext:LS.get('hinttext','1')==='1',
 /* quality of life (always on from 0.6.0 to 0.13.5, switches again since 0.14.0): eased movement, the map going back to Lara, fading map buttons */
 smooth:LS.get('smooth','1')==='1',autocenter:LS.get('autocenter','1')==='1',fadectl:LS.get('fadectl','1')==='1'};
function sv(k,v){CFG[k]=v;LS.set(k,typeof v==='boolean'?(v?'1':'0'):String(v));if(document.getElementById('over').style.display==='flex')openSet();hintDraw();draw()}
function tog(k){sv(k,!CFG[k])}
var HOST=window.Native||null;
/* DUAL: the page runs inside Tomb Raider Dual, which answers Native.poll from its own emulator (no RetroArch, no link settings) */
var DUAL=!!(HOST&&HOST.stateInfo);
/* Android keeps this window from taking keyboard focus (so the controller stays with RetroArch); a text box asks for it */
function kb(on){if(HOST&&HOST.focusable)HOST.focusable(on)}

/* ================= files built from the player's disc (trbuild.js) =================
   Nothing from the game ships with the app: on first start the player picks their Tomb Raider disc and the builder makes the
   pictures, names and level data into the app's gen folder. manifest.json there: {v, t, disc, ext, levels, icons}. */
var GEN={ready:false,man:null,base:'',names:null,busy:null};
function genLoad(){GEN.ready=false;if(!HOST)return;
 try{var d=String(HOST.genDir()).replace(/\\/g,'/');GEN.base=encodeURI((d.charAt(0)==='/'?'file://':'file:///')+d+'/');
  var m=HOST.genRead('manifest.json');if(m){GEN.man=JSON.parse(m);GEN.ready=GEN.man.v===TB.VERSION;GEN.names=JSON.parse(HOST.genRead('names.json')||'null')}}catch(e){GEN.ready=false}
 fontLoad()}
/* the game's own lettering (trfont.js): made once from a built level and kept as gen/font.b64, which Dual's menu reads too */
var fontOn=false;function fontLoad(){if(fontOn||!GEN.ready||!window.FontFace)return;
 try{var t=HOST.genRead('font.b64')||'';
  if(!t){var u=TRFONT.build(TRL.parse(unb64(HOST.genRead('lv/1/geo.b64'))));if(!u)return;t=b64(u);var by=new Uint8Array(t.length);for(var i=0;i<t.length;i++)by[i]=t.charCodeAt(i);
   var r=HOST.genWriteBytes?HOST.genWriteBytes('font.b64',by):HOST.genWrite('font.b64',b64(by));if(r!=='ok')console.error('could not save the font: '+r)}
  var f=new FontFace('TRGame',unb64(t).slice().buffer);fontOn=true;f.load().then(function(){document.fonts.add(f);draw();hintDraw()},function(e){fontOn=false;console.error('font: '+e)})}catch(e){console.error('font: '+e)}}
function asset(p){return GEN.base+p+'?'+(GEN.man?GEN.man.t:0)}
/* story steps saved from the editor (editor.html, SAVE TO LINK) as gen/hints.json take the place of hints.js; looked at again
   every few seconds, so an edit shows without restarting */
var BUILTIN_HINTS=HINTS,MYHINTS='';
function hintsCheck(){if(!HOST||!HOST.genRead)return;var t='';try{t=HOST.genRead('hints.json')||''}catch(e){}if(t===MYHINTS)return;MYHINTS=t;
 var h=null;if(t)try{h=JSON.parse(t)}catch(e){}HINTS=h&&typeof h==='object'?h:BUILTIN_HINTS;
 RC.key='';if(LV.n>=0){(HINTS[LV.n]||[]).forEach(function(s){stepItems(s).forEach(function(k){if(LV.watch&&LV.watch.indexOf(k)<0)LV.watch.push(k)})});STEP.view=-1;stepUpdate();hintDraw();draw()}}
function hintsBuiltin(){var r=HOST.genWriteBytes?HOST.genWriteBytes('hints.json',new Uint8Array(0)):HOST.genWrite('hints.json','');hintsCheck();openSet()}
function encImg(w,h,rgba){var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(rgba.buffer,rgba.byteOffset,rgba.length),w,h),0,0);
 return new Promise(function(res,rej){c.toBlob(function(b){if(!b){rej(new Error('Could not make a picture'));return}b.arrayBuffer().then(function(a){res(new Uint8Array(a))})},GEN.ext==='webp'?'image/webp':'image/png',0.85)})}
function b64(u8){var s='',CH=8192;for(var i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));return btoa(s)}
/* base64 straight to bytes through a table (atob's binary string was very slow for megabyte strings from the bridge) */

 +(cmp||CFG.rot?'<div class="row"><label>Up is</label>'+seg('turnby',[['camera','CAMERA'],['lara','LARA']])+'</div>':'')
 +(cmp?'':opt('reveal','Reveal as you explore'))
 /* HINTS: how much help the story steps give */
 +'<div class="sec">HINTS</div>'+'<div class="row"><label>'+sub('Next step','The way and the spot'+(cmp?', and the compass needle':''))+'</label>'+seg('step',[[true,'ON'],[false,'OFF']])+'</div>'
 +'<div class="row"><label>'+sub('Hint text','Off: only the step number')+'</label>'+seg('hinttext',[[true,'ON'],[false,'OFF']])+'</div>'
 +'<div class="row"><label>Directions in the secrets list</label>'+seg('secway',[[true,'ON'],[false,'OFF']])+'</div>'
 /* ON THE MAP: markers (the map only) */
 +(cmp?'':'<div class="sec">ON THE MAP</div>'+opt('pickups','Pickups')+opt('secrets','Secrets'))
 /* QUALITY OF LIFE */
 +'<div class="sec">QUALITY OF LIFE</div>'+opt('smooth','Smooth movement')+(cmp?'':opt('autocenter','Map returns to Lara')+opt('fadectl','Fade the map buttons'))
 +'<div class="sec">STORY</div><div class="row"><label>This level\'s steps and explored rooms</label><button onclick="resetSteps()">START OVER</button></div>'
 +(hallRead().length?'<div class="row"><label>Runs you signed</label><button onclick="openHall()">SHOW</button></div>':'')
 +'<div class="sec fold" onclick="devOpen=!devOpen;openSet()">'+(devOpen?'&#9662;':'&#9656;')+' DEVELOPER</div>'
 +(devOpen?(DUAL?'':'<div class="row"><label>Memory read mode</label>'+seg('mode',[['auto','AUTO'],['m80','M80'],['m00','M00'],['ram','RAM']])+'</div>')
  +'<div class="row"><label>Map files from '+esc(GEN.man&&GEN.man.disc||'-')+'</label><button onclick="closeSet();discPick()">REBUILD</button></div>'
  +'<div class="row"><label>Record route<br><span class="small">Turns your play into this level\'s story steps and guide lines (replacing its steps), saved for the editor</span></label>'
  +'<span class="seg"><button class="'+(RECON?'on':'')+'" onclick="recToggle(true)">ON</button><button class="'+(RECON?'':'on')+'" onclick="recToggle(false)">OFF</button></span></div>'
  +(MYHINTS?'<div class="row"><label>Story steps from the editor or Record route</label><button onclick="hintsBuiltin()">USE THE APP\'S</button></div>':'')
  +'<p class="small">Tomb Raider Link '+VERSION+' · Tomb Raider (USA), SLUS-00152'+(DUAL?'':' · RetroArch 127.0.0.1:'+CFG.port)+'</p>':'')
 +'<div class="row"><span style="flex:1"></span><button class="primary" onclick="closeSet()">DONE</button></div>';
 document.getElementById('setcard').innerHTML=h;document.getElementById('over').style.display='flex'}
function closeSet(){document.getElementById('over').style.display='none';secOpen=false}
/* ================= the ending card =================
   The game only keeps the stats of the level being played (time, kills, pickups, secrets at 0x928F8), so the page keeps each level's as it is
   played (RUN, stored as tr_run). Going back to an earlier level drops the later ones, and Caves starts a new run. A level played while the page
   wasn't linked has no stats and the card says so. The card opens when the Great Pyramid ends (the ending flag on level 15) and stays until
   CLOSE or the next level starts. SAVE keeps the run with the signature; Settings shows the ones saved. DEV CODES USED comes from Dual. */
var RUN=(function(){try{var r=JSON.parse(LS.get('run','{}'))||{};r.lv=r.lv||{};return r}catch(e){return {lv:{}}}})(),runAt=0,REPORT=null,sigInk=false,sigPen=null;
function runSave(){LS.set('run',JSON.stringify(RUN))}
function runEnter(n){if(n<1||n>15)return;Object.keys(RUN.lv).forEach(function(k){if(+k>n)delete RUN.lv[k]});RUN.ended=false;
 if(n===1){RUN.dev=false;if(HOST&&HOST.devNewRun)HOST.devNewRun()}
 runSave();if(REPORT)endClose()}
function bits(v){var c=0;for(v=v||0;v;v>>=1)c+=v&1;return c}
function runTick(){if(LV.n<1||LV.n>15)return;
 if(HOST&&HOST.devUsed&&HOST.devUsed()&&!RUN.dev){RUN.dev=true;runSave()}
 var t=u32(A.PROG),e=RUN.lv[LV.n];
 if(t!=null&&(!e||e[0]!==t)){RUN.lv[LV.n]=[t,u16(A.PROG+4)||0,u16(A.PROG+0x16)||0,bits(G.secrets),secretList().length];
  if(G.ending||Date.now()-runAt>4000){runAt=Date.now();runSave()}}
 if(G.ending&&LV.n===15&&!RUN.ended&&t!=null)endOpen()}
function hms(f){var s=Math.floor(f/30),h=Math.floor(s/3600),m=Math.floor(s/60)%60;s%=60;return h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function p2(n){return (n<10?'0':'')+n}
function endOpen(){RUN.ended=true;runSave();var d=new Date(),rows=[];for(var i=1;i<=15;i++){var e=RUN.lv[i];rows.push([GEN.names&&GEN.names.levels[i]||('Level '+i)].concat(e||[]))}
 REPORT={date:d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),clock:p2(d.getHours())+':'+p2(d.getMinutes()),rows:rows,dev:!!RUN.dev,saved:false};
 LS.set('report',JSON.stringify(REPORT));endShow()}
/* the table, for the card and for a saved run */
function endTable(r){var T=[0,0,0,0,0],got=0;r.rows.forEach(function(q){if(q.length>1){got++;for(var i=0;i<5;i++)T[i]+=q[i+1]||0}});
 return '<table><tr><th>LEVEL</th><th>TIME</th><th>KILLS</th><th>PICKUPS</th><th>SECRETS</th></tr>'
  +r.rows.map(function(q){return q.length>1?'<tr><td>'+esc(q[0])+'</td><td>'+hms(q[1])+'</td><td>'+q[2]+'</td><td>'+q[3]+'</td><td>'+q[4]+'/'+q[5]+'</td></tr>':'<tr class="miss"><td>'+esc(q[0])+'</td><td colspan="4">not recorded</td></tr>'}).join('')
  +'<tr class="total"><td>TOTAL'+(got<r.rows.length?' ('+got+' of '+r.rows.length+')':'')+'</td><td>'+hms(T[0])+'</td><td>'+T[1]+'</td><td>'+T[2]+'</td><td>'+T[3]+'/'+T[4]+'</td></tr></table>'}
/* the same rows as a list, for short landscape screens (CSS picks which shows) */
function endGrid(r){var T=[0,0,0,0,0],got=0;r.rows.forEach(function(q){if(q.length>1){got++;for(var i=0;i<5;i++)T[i]+=q[i+1]||0}});
 var row=function(c,n,v){return '<div class="lr'+c+'"><span class="n" title="'+esc(n)+'">'+esc(n)+'</span>'+v+'</div>'},
  nums=function(q){return '<span>'+hms(q[0])+'</span><span>'+q[1]+'</span><span>'+q[2]+'</span><span>'+q[3]+'/'+q[4]+'</span>'},
  head='<div class="lh"><span>LEVEL</span><span>TIME</span><span>KILLS</span><span>PICKUPS</span><span>SECRETS</span></div>',
  tot=row(' total','TOTAL'+(got<r.rows.length?' ('+got+' of '+r.rows.length+')':''),nums(T));
 return '<div class="endg"><div class="heads">'+head+head+'</div><div class="lscroll" style="--half:'+Math.ceil(r.rows.length/2)+'">'
  +r.rows.map(function(q){return q.length>1?row('',q[0],nums(q.slice(1))):row(' miss',q[0],'<span class="nr">not recorded</span>')}).join('')
  +tot+'</div>'+tot+'</div>'}   /* the total twice: in the list's last place when it has two columns (always in view there), under it otherwise */
function endShow(){var r=REPORT;closeSet();
 document.getElementById('endtxt').innerHTML='<h2 class="gold">Adventure complete</h2><div class="small date">'+r.date+' '+r.clock+(r.dev?'<span class="devs"> &middot; DEV CODES USED</span>':'')+'</div>'+endTable(r)+endGrid(r)
  +(r.dev?'<div class="dev">DEV CODES USED</div>':'')+'<div class="small">'+(r.saved?'Signed':'Sign your name')+'</div>';
 document.getElementById('end').style.display='block';sigClear();sigState()}
function sigState(){var s=REPORT&&REPORT.saved;document.getElementById('sigbox').className=s?'done':'';document.getElementById('sigclr').style.display=s?'none':'';document.getElementById('sigsave').style.display=s?'none':'';document.getElementById('sigmsg').textContent=s?'Saved. Settings shows your signed runs.':''}
function sigClear(){var c=document.getElementById('sigbox');c.getContext('2d').clearRect(0,0,c.width,c.height);sigInk=false}
function hallRead(){try{return JSON.parse(LS.get('hall','[]'))||[]}catch(e){return []}}
function sigSave(){if(!REPORT||REPORT.saved)return;var m=document.getElementById('sigmsg');if(!sigInk){m.textContent='Sign first.';return}
 var h=hallRead();h.push({date:REPORT.date,clock:REPORT.clock,rows:REPORT.rows,dev:REPORT.dev,sig:document.getElementById('sigbox').toDataURL('image/png')});h=h.slice(-20);
 var txt=JSON.stringify(h);LS.set('hall',txt);if(LS.get('hall','')!==txt){m.textContent='Could not save.';return}
 REPORT.saved=true;LS.set('report',JSON.stringify(REPORT));document.getElementById('endtxt').lastChild.textContent='Signed';sigState()}
function endClose(){REPORT=null;LS.set('report','');document.getElementById('end').style.display='none';draw();hintDraw()}
(function(){var c=document.getElementById('sigbox');
 function at(e){var b=c.getBoundingClientRect();return [(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]}
 function line(a,b){var x=c.getContext('2d');x.strokeStyle='#fff3d0';x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0]+.01,b[1]);x.stroke();sigInk=true}
 c.addEventListener('pointerdown',function(e){if(!REPORT||REPORT.saved)return;e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(x){}sigPen=at(e);line(sigPen,sigPen)});
 c.addEventListener('pointermove',function(e){if(!sigPen)return;var p=at(e);line(sigPen,p);sigPen=p});
 function up(){sigPen=null}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)})();
function openHall(){var h=hallRead().slice().reverse();
 document.getElementById('setcard').innerHTML='<h2 class="gold">Runs you signed</h2><div id="hall">'+h.map(function(r){return '<div class="sec">'+r.date+' '+r.clock+(r.dev?' &middot; <span style="color:var(--red)">DEV CODES USED</span>':'')+'</div><div class="endt">'+endTable(r)+'</div><img alt="" src="'+r.sig+'">'}).join('')+'</div><div class="row"><span style="flex:1"></span><button class="primary" onclick="openSet()">BACK</button></div>';
 document.getElementById('over').style.display='flex'}
/* the secrets panel (tap the ★ counter): each of the level's secrets, FOUND or NOT FOUND from the level's progress bits, with
   how far and which way it is; SHOW moves the map there. A secret's place is the middle of the floor squares that trigger it. */
var secOpen=false;
/* A secret is the trigger squares with its number, in one room (or its flipped twin) or within 3 blocks of each other. Numbers
   are not always one per secret: the Great Pyramid's rooms 23 and 64 both set secret 0, so the level has 3 secret places on
   2 numbers (as the game's own "of 3" says). Both show as found once that number is (the game can't tell them apart either). */
function secretList(){var d=LV.data;if(!d)return [];if(LV.secG)return LV.secG.map(function(s){s.got=G.secrets!=null&&!!((G.secrets>>s.i)&1);return s});var out=[];
 d.secrets.forEach(function(q){var g=null;
  for(var i=0;i<out.length&&!g;i++){var o=out[i];if(o.i!==q[0])continue;for(var k=0;k<o.pts.length;k++){var p=o.pts[k];if(canon(p[1])===canon(q[1])||Math.hypot(p[2]-q[2],p[4]-q[4])<=3072&&Math.abs(p[3]-q[3])<=2048){g=o;break}}}
  if(!g){g={i:q[0],pts:[]};out.push(g)}g.pts.push(q)});
 out.forEach(function(s){var n=s.pts.length;s.x=s.pts.reduce(function(a,p){return a+p[2]},0)/n;s.y=s.pts.reduce(function(a,p){return a+p[3]},0)/n;s.z=s.pts.reduce(function(a,p){return a+p[4]},0)/n;s.room=s.pts[0][1];
  s.shared=out.filter(function(o){return o.i===s.i}).length>1});
 LV.secG=out.sort(function(a,b){return a.i-b.i||a.room-b.room});return secretList()}
function openSecrets(){var L=secretList();if(!L.length)return;secOpen=true;var nf=0;for(var b=G.secrets||0;b;b>>=1)nf+=b&1;
 var h='<h2 class="gold">Secrets</h2><p class="small">'+esc(GEN.names&&GEN.names.levels[LV.n]||'')+' &middot; '+nf+' of '+L.length+' found</p>'
  +'<div class="row"><label>How far and which way</label><span class="seg">'+[[true,'ON'],[false,'OFF']].map(function(it){
   return '<button class="'+(CFG.secway===it[0]?'on':'')+'" onclick="secWay('+it[0]+')">'+it[1]+'</button>'}).join('')+'</span></div>';
 L.forEach(function(s,k){var way=CFG.secway?wayTo(s.x,s.y,s.z,0.5,'right here'):'';
  var tw=s.shared?L.filter(function(o){return o!==s&&o.i===s.i}).map(function(o){return L.indexOf(o)+1}):[];
  h+='<div class="row secrow"><span class="secno gold">'+(k+1)+'</span><label>'+(s.got?'':way)+(tw.length?'<br><span class="small">The game counts this and secret '+tw.join(', ')+' as one.</span>':'')+'</label>'
   +'<span class="badge '+(s.got?'ok':'no')+'">'+(s.got?'FOUND':'NOT FOUND')+'</span>'
   +(s.got?'':'<button onclick="showAt('+Math.round(s.x)+','+Math.round(s.z)+')">SHOW</button>')+'</div>'});
 h+='<div class="row"><span style="flex:1"></span><button class="primary" onclick="closeSet()">DONE</button></div>';
 document.getElementById('setcard').innerHTML=h;document.getElementById('over').style.display='flex'}
/* the secrets list's distance and direction, on or off (kept) */
function secWay(on){CFG.secway=on;LS.set('secway',on?'1':'0');openSecrets()}
/* SHOW: pan the map to a spot (CENTRE on the map brings it back to Lara) */
function showAt(x,z){closeSet();view.dx=x-G.x;view.dz=z-G.z;view.mark=[x,z];draw()}
/* ================= Record route (Developer) =================
   While on, each level played is turned into story steps from the play itself: Lara's path is kept (a point every half block,
   started again after a jump such as loading a save), and a step is made whenever a key item, gun or Scion is taken, a switch
   pulled, or a keyhole or puzzle slot used (the item linked, its place as the spot, the path since the step before as the
   guide line); MARK STEP (the map's ✚ button) adds one where Lara stands, and the level's end adds "Make for the level exit".
   The level's steps are replaced by the recorded ones once the first is made, and saved as gen/hints.json (as the editor's
   SAVE TO LINK does), so the editor can load them to fix the words. */
var RR=null,RECON=LS.get('rec','0')==='1';
var RECTYPES=[55,56,84,85,86,87,110,111,112,113,118,119,120,121,126,129,130,131,132,137,138,139,140,143,144,145];
function recBegin(){if(!RECON||LV.n<0||!LV.data||LV.demo){RR=null;return}
 RR={n:LV.n,steps:[],trail:[],seen:{},ended:false};
 LV.data.items.forEach(function(it,i){if(RECTYPES.indexOf(it[0])>=0&&LV.watch.indexOf(i)<0)LV.watch.push(i)})}
function recToggle(on){RECON=on;LS.set('rec',on?'1':'0');if(on)recBegin();else RR=null;openSet();draw()}
function recName(t){var nm=LV.names||{};
 if(t===55||t===56)return 'Pull the switch.';
 if(t>=137&&t<=140)return 'Use the '+(nm[129+t-137]||'key')+'.';
 if(t>=118&&t<=121)return 'Place the '+(nm[110+t-118]||'item')+'.';
 return 'Take the '+(nm[t]||({84:'Pistols',85:'Shotgun',86:'Magnums',87:'Uzis'})[t]||'item')+'.'}
/* fewer points: drop those within 384 units of the straight line between their neighbours (Douglas-Peucker) */
function recSimplify(P){if(P.length<3)return P.slice();var keep=new Array(P.length).fill(false);keep[0]=keep[P.length-1]=true;
 (function dp(a,b){var A=P[a],B=P[b],best=-1,bi=-1,ex=B[0]-A[0],ey=B[1]-A[1],ez=B[2]-A[2],l2=ex*ex+ey*ey+ez*ez||1;
  for(var i=a+1;i<b;i++){var Q=P[i],t=Math.max(0,Math.min(1,((Q[0]-A[0])*ex+(Q[1]-A[1])*ey+(Q[2]-A[2])*ez)/l2)),d=Math.hypot(Q[0]-A[0]-ex*t,Q[1]-A[1]-ey*t,Q[2]-A[2]-ez*t);if(d>best){best=d;bi=i}}
  if(best>384){keep[bi]=true;dp(a,bi);dp(bi,b)}})(0,P.length-1);
 return P.filter(function(p,i){return keep[i]})}
function recStep(text,item,spot){var path=recSimplify(RR.trail).slice(1).filter(function(p){return Math.hypot(p[0]-spot[0],p[2]-spot[2])>768});
 var s=['?'+text,spot[3],Math.round(spot[0]),Math.round(spot[1]),Math.round(spot[2]),item];if(path.length)s.push(path.map(function(p){return [p[0],p[1],p[2],p[3]]}));
 RR.steps.push(s);RR.trail=[[G.x,G.y,G.z,canon(G.room)]];recSave();console.log('recorded step '+RR.steps.length+': '+text)}
function recSave(){var all=JSON.parse(JSON.stringify(HINTS));all[RR.n]=RR.steps;var j=JSON.stringify(all),u=new TextEncoder().encode(j);
 var r=HOST.genWriteBytes?HOST.genWriteBytes('hints.json',u):HOST.genWrite('hints.json',b64(u));if(r!=='ok')console.error('could not save the recorded steps: '+r);hintsCheck()}
function recMark(){if(!RR||!G.ok)return;recStep('New step.',-1,[G.x,G.y,G.z,canon(G.room)]);hintDraw();draw()}
/* each read of the game while recording */
function recTick(){if(!RR||RR.n!==LV.n||!G.ok||G.demo||RR.ended)return;
 /* first: wait until every watched item has been read once, and count what is already done as seen (no steps for it) */
 if(!RR.primed){if(!LV.watch.every(function(i){return LV.taken[i]!=null}))return;LV.watch.forEach(function(i){RR.seen[i]=LV.taken[i]?1:0});RR.primed=true}
 var p=[G.x,G.y,G.z,canon(G.room)],l=RR.trail[RR.trail.length-1];
 if(!l)RR.trail.push(p);else{var d=Math.hypot(p[0]-l[0],p[1]-l[1],p[2]-l[2]);if(d>8192)RR.trail=[p];else if(d>=512||p[3]!==l[3])RR.trail.push(p)}
 LV.watch.forEach(function(i){var it=LV.data.items[i];if(RECTYPES.indexOf(it[0])<0)return;
  if(LV.taken[i]&&!RR.seen[i]){RR.seen[i]=1;recStep(recName(it[0]),i,[it[2],it[3],it[4],canon(it[1])])}
  else if(!LV.taken[i])RR.seen[i]=0});   /* back after loading a save: can be made again */
 if(G.ending){RR.ended=true;recStep('Make for the level exit.',-1,p)}}
function resetSteps(){if(LV.n<0)return;LV.reached={};LS.set('reach_'+LV.n,'{}');LV.moved={};LV.snapFor=-1;LS.set('moved_'+LV.n,'{}');LV.seen={};LS.set('seen_'+LV.n,'{}');RC.key='';STEP.view=-1;stepUpdate();hintDraw();draw()}

/* ================= start ================= */
genLoad();hintsCheck();setInterval(hintsCheck,3000);applyTheme();bootShow();hintDraw();draw();poll();
try{var r0=JSON.parse(LS.get('report','')||'null');if(r0&&!r0.saved){REPORT=r0;endShow()}}catch(e){}   /* a card not signed yet comes back after a restart */
/* a disc was chosen before but the built files are missing or from an older builder: build again without asking */
if(HOST&&!GEN.ready&&+HOST.discSize()>0)genBuild();
if(window.TestKit)TestKit.start();
</script>
